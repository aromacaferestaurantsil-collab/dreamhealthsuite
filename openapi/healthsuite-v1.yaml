openapi: 3.1.0
info:
  title: HealthSuite 360 API
  version: 1.0.0
  description: Versioned tenant-scoped API contract. Routes become active only when their authenticated Edge Function handlers are implemented.
servers:
  - url: https://{project-ref}.supabase.co/functions/v1/api-v1
    variables:
      project-ref:
        default: your-project-ref
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: API health and version
      security: []
      responses:
        '200':
          description: API status
  /tenant/context:
    get:
      summary: Current user's active tenant and branch memberships
      responses:
        '200':
          description: Tenant context
  /pharmacy/catalogue:
    get:
      summary: Search tenant medicine catalogue
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200': { description: Paginated medicine catalogue }
  /pharmacy/purchase-recommendations:
    get:
      summary: Demand and stock-based purchase recommendations
      parameters:
        - in: query
          name: branch_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: horizon_days
          schema: { type: integer, minimum: 7, maximum: 730, default: 365 }
      responses:
        '200': { description: Recommendation lines and source-data coverage }
  /pharmacy/purchase-orders:
    post:
      summary: Create a multi-line purchase order
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, supplier_id, order_number, items]
              properties:
                branch_id: { type: string, format: uuid }
                supplier_id: { type: string, format: uuid }
                order_number: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [medicine_id, quantity, unit_cost]
                    properties:
                      medicine_id: { type: string, format: uuid }
                      quantity: { type: number, exclusiveMinimum: 0 }
                      unit_cost: { type: number, minimum: 0 }
                      tax_rate: { type: number, minimum: 0, maximum: 100 }
      responses:
        '201': { description: Purchase order created }
        '409': { description: Duplicate idempotency key or order number }
  /pharmacy/customer-orders:
    post:
      summary: Submit a customer medicine order for pharmacist review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, items]
              properties:
                branch_id: { type: string, format: uuid }
                prescription_upload_id: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      medicine_id: { type: string, format: uuid }
                      requested_name: { type: string }
                      quantity: { type: number, exclusiveMinimum: 0 }
      responses:
        '202': { description: Submitted for pharmacist review }
  /pharmacy/customer-orders/{order_id}/review:
    post:
      summary: Pharmacist decision on prescription/order
      parameters:
        - in: path
          name: order_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Review recorded }
  /integrations/{provider}/connect:
    post:
      summary: Start tenant-owned OAuth authorization-code + PKCE connection
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string }
      responses:
        '200': { description: Authorization URL and one-time state }
  /integrations/{provider}/disconnect:
    post:
      summary: Revoke and disconnect tenant integration
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string }
      responses:
        '204': { description: Disconnected }
  /webhooks/{provider}:
    post:
      summary: Provider webhook receiver; validates signature and replay protection
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string }
      responses:
        '202': { description: Event accepted after signature validation }
        '401': { description: Invalid signature }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
